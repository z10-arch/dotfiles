# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# Key bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General settings
# Enable wheel scrolling, pane selection, and copy-mode selection. A narrow
# Zsh binding discards any legacy mouse reports leaked by this terminal.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -g set-clipboard on
# Do not allow pane programs to alter the outer terminal's input modes.
set -g allow-passthrough off
set-window-option -g mode-keys vi

# Compact, centred status labels with no theme dependency.
set -g status-style 'bg=default,fg=default'
set -g status-justify centre
set -g status-left ''
set -g status-right ''
set -g window-status-separator ' '
set -g window-status-format '#I:#W'
set -g window-status-current-format '#[bold]#I:#W#[nobold]'
set -g window-status-style 'bg=default,fg=default'
set -g window-status-current-style 'bg=default,fg=default,bold'
set -g pane-border-style 'fg=default,bg=default'
set -g pane-active-border-style 'fg=default,bg=default'
set -g message-style 'bg=default,fg=default'

bind-key -n F12 if -F "#{==:#{status},on}" \
  "set -g status off" \
  "set -g status on"

# TPM auto installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# TPM (must be last)
run '~/.tmux/plugins/tpm/tpm'
